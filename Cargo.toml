[package]
name = "jotdown-rs"
version = "0.2.1"
authors = ["Brandon Greenwell <greenwell.brandon@gmail.com>"]
edition = "2021"
description = "A minimalist, command-line jotting utility that's fast, private, and git-friendly."
license = "MIT"
repository = "https://github.com/bgreenwell/jotdown-rs"
homepage = "https://github.com/bgreenwell/jotdown-rs"
readme = "README.md"
keywords = ["cli", "journal", "notes", "markdown", "log"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "jd"
path = "src/main.rs"

[dependencies]
age = "0.10"
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0.1"
rand = "0.8"
rustyline = "14.0"
rustyline-derive = "0.10.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.0"
which = "4.4.2"
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
zip = { version = "2.1", features = ["zstd"] }
syntect = "5.3.0"

# Non-Windows dependencies (the fuzzy-finder `select` command and its skim/crossbeam-channel backend)
[target.'cfg(not(windows))'.dependencies]
crossbeam-channel = "0.5"
skim = "0.10.4"

[dev-dependencies]
assert_cmd = "2.0"
chrono = "0.4"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.release]
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
pre-release-commit-message = "chore: release {{version}}"
tag-message = "Release {{version}}"

[package.metadata.aur]
depends = []
makedepends = ["cargo"]

[package.metadata.wix]
upgrade-guid = "98CB9509-7E8F-49BF-8835-B0CCB415EB19"
path-guid = "AC01D848-99A9-4597-AE3B-5A7F54BD907E"
license = false
eula = false
